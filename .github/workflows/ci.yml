name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  desktop_ui:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm --prefix ui/desktop test
      - run: npm --prefix ui/desktop run build

  desktop_host:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop
      - run: npm --prefix ui/desktop run build
      - run: cargo fmt --manifest-path apps/desktop/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/desktop/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo build --manifest-path apps/desktop/Cargo.toml --locked
      - run: cargo test --no-fail-fast --manifest-path apps/desktop/Cargo.toml --locked
      # The explicit WebView startup smoke test needs an interactive Windows session.

  # ---------------------------------------------------------------------------
  # The four core gates -- `fmt --check`, `clippy -D warnings`,
  # `build --workspace --all-targets`, `test --workspace` -- run on BOTH
  # ubuntu-latest and windows-latest. Windows is a first-class target, not a
  # smoke test.
  #
  # `fail-fast: false` is deliberate: a failure on one OS must never cancel the
  # other leg. The *difference* between the two legs is the signal this matrix
  # exists to produce, so both legs must always report.
  # ---------------------------------------------------------------------------
  fmt_lint:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  build_test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo build --locked --workspace --all-targets
      # `SSK_REQUIRE_IPV6=1` turns "this host has no `::1`" from a printed
      # `SKIPPED:` into a failure, so the IPv6 literal dial cannot go unexercised
      # unnoticed. It is set on the step because the `runner` context is not
      # available in job-level `env:`. Whether the ubuntu runner has `::1` is
      # UNVERIFIED: a red Linux leg here means "decide", not "ignore".
      - run: cargo test --locked --no-fail-fast --workspace
        env:
          SSK_REQUIRE_IPV6: ${{ runner.os == 'Linux' && '1' || '0' }}
      - name: Check read-only VM host assessment with synthetic facts
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\tests\openvpn-vm-host-probe.tests.ps1

  # `PROPTEST_CASES=32 cargo test` (inline env-var prefix) is POSIX-shell-only
  # syntax and is a parse error under PowerShell, so it is set via `env:`
  # instead -- portable across every runner shell.
  proptest_smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --locked --no-fail-fast --workspace
        env:
          PROPTEST_CASES: 32

  replay_vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --locked --no-fail-fast -p ssk-runtime --test replay_vectors

  interop_contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --locked --no-fail-fast -p ssk-interop

  # Runs on both OSes: the schema export goes through the `ssk` CLI, which is a
  # shipped Windows binary, so a Windows-only break in that path must be caught
  # here. The redirect, `test` and `cmp` are POSIX constructs, so the step
  # declares `shell: bash` (available on GitHub's Windows runners via Git
  # Bash). The export target is a relative path inside the checkout rather than
  # the Unix-only `/tmp` -- and rather than `$RUNNER_TEMP`, which on Windows is
  # a backslash-separated path that Git Bash would have to round-trip.
  config_schema_guard:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # No test-name filter: `cargo test <filter>` that matches nothing exits 0,
      # so renaming the snapshot test would have turned this step into a no-op.
      - run: cargo test --locked --no-fail-fast -p ssk-config
      - name: Export config schema and assert it is the pinned schema
        shell: bash
        run: |
          cargo run -p ssk-cli -- config schema --json > ssk-config-schema.json
          test -s ssk-config-schema.json
          # A non-empty file proves nothing: the shipped binary must print the
          # golden schema byte for byte (the golden file is that output).
          set -- crates/ssk-config/tests/golden/ssk-config-v*.schema.json
          test "$#" -eq 1
          cmp ssk-config-schema.json "$1"
          rm -f ssk-config-schema.json

  # Fails a push or pull request that changes a contract surface
  # (scripts/ci/contract_surfaces.txt) without a docs/COMPATIBILITY_MATRIX.md
  # change or a `Compat-Impact: none (<reason>)` commit message line in the same
  # range. It has no `if:` on purpose: a job that is skipped on `push` is read as
  # success by `ci_gate`, so a direct push would never have been checked.
  #
  # `fetch-depth: 0` is required: `actions/checkout`'s default depth of 1 has no
  # merge base. The old step then ran `git diff ... | tee`, whose status is tee's
  # (GitHub's documented default shell, `bash -e`, has no pipefail), so git's exit
  # 128 was swallowed and the step stayed green.
  #
  # UNVERIFIED until a pull request has run it (design 21.3): the checkout depth,
  # the `github.event.*` fields below and the shell flags. Only the script's logic
  # is exercised, by `contract_guard_selftest`.
  breaking_change_guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Contract surfaces need a compatibility note
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            head="$GITHUB_SHA"; base="$PUSH_BEFORE"
            # A new branch (all-zero `before`) or a force push (the old tip is gone):
            # check everything the branch has beyond the default branch.
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git merge-base "origin/${DEFAULT_BRANCH}" "$head")"
            fi
          fi
          echo "contract guard: base=$base head=$head"
          sh scripts/ci/contract_guard.sh "$base" "$head"

  # The guard's logic against throw-away repositories. Runs on every push and
  # pull request, so it is exercised even when no pull request exists.
  contract_guard_selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: sh scripts/ci/tests/contract_guard.test.sh

  no_std_core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --locked -p ssk-types --no-default-features
      - run: cargo check --locked -p ssk-core --no-default-features

  netadmin_contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --locked --no-fail-fast -p ssk-netadmin

  conformance_suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --locked --no-fail-fast -p ssk-interop conformance

  chaos_drills:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --locked --no-fail-fast -p ssk-faultscan

  # cargo-audit / cargo-deny are pinned to exact versions. An unpinned
  # `cargo install --locked` picks up whatever is newest at job start, which
  # makes an unrelated upstream release able to turn CI red (or, worse, green)
  # with no commit in this repo. Bump these deliberately.
  cargo_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings

  cargo_deny:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check

  # Real Windows validation for the privileged `ssk-winhost` backends (the
  # BoundaryEnforcer / TrafficSource / PrivilegedHelper "hands"): it builds the
  # `ssk` CLI alongside the crate so the shipped Windows binaries are exercised
  # as a unit. The workspace-wide Windows legs of `fmt_lint` / `build_test`
  # above now also cover this crate; this job is retained as a fast, narrowly
  # scoped signal that names the failing area directly instead of inside a
  # 44-crate workspace run. Privileged, Administrator-only integration
  # (installing a firewall rule / a real service) is not exercised here -- that
  # is the operator validation documented in RUNBOOK_WINDOWS.md.
  windows_backends:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo build --locked -p ssk-winhost -p ssk-cli
      - run: cargo clippy --locked -p ssk-winhost --all-targets -- -D warnings
      - run: cargo test --locked --no-fail-fast -p ssk-winhost

  # Per-crate Windows gates for the four crates that had never been compiled or
  # run on Windows in CI before this job existed: the IPC transport, the daemon,
  # the privileged broker, and the GUI bridge.
  #
  # These are REAL gates. In particular `ssk-netd-helper` is known to fail 8 of
  # its 12 `p0_broker` tests on an *unelevated* Windows box (an icacls/DACL
  # self-lockout in `store.rs`, see WINDOWS_PRODUCT_ROADMAP.md 1.2 / 5.2). A
  # GitHub windows-latest runner executes as an administrator, so this job is
  # the experiment that answers whether the failure is an unelevated-caller
  # artifact or a real defect. It is deliberately NOT `continue-on-error`: a red
  # result here is the answer we are asking for, not a badge problem to hide.
  # The fix itself is P1 scope.
  #
  # `fail-fast: false` so one crate's failure does not suppress the other three
  # crates' results.
  windows_crate_gates:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        crate: [ssk-ipc, ssk-daemon, ssk-netd-helper, ssk-tauri-bridge]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo build --locked -p ${{ matrix.crate }} --all-targets
      - run: cargo clippy --locked -p ${{ matrix.crate }} --all-targets -- -D warnings
      - run: cargo test --locked --no-fail-fast -p ${{ matrix.crate }}

  # One check name to require in branch protection. `needs` + `if: always()` makes
  # it fail when ANY job failed or was cancelled, and a skipped job does not
  # count as a failure (so no gated job may carry an `if:` that skips it on push
  # or pull_request: it would then be read as green). Without
  # one aggregate check, a red job that nobody marked "required" is easy to miss:
  # the CI run on main for the 2026-10-04 merge had 9 of 25 jobs red.
  ci_gate:
    if: always()
    needs: [desktop_ui, desktop_host, fmt_lint, build_test, proptest_smoke, replay_vectors, interop_contracts, config_schema_guard, breaking_change_guard, contract_guard_selftest, no_std_core, netadmin_contracts, conformance_suite, chaos_drills, cargo_audit, cargo_deny, windows_backends, windows_crate_gates]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
