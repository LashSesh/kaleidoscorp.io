# cargo-deny configuration — Adamant-Grade dependency policy
# Run: cargo deny check

[advisories]
# Deny crates with known security advisories (cargo-deny's default behavior
# for `[advisories]` already denies all reported vulnerabilities; `deny = []`
# was removed here since newer cargo-deny versions (0.16+) no longer accept
# that key in this section — ignore-listing stays available below).
version = 2
ignore = []

[licenses]
# Allow OSI-approved permissive and copyleft-compatible licenses only.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
]
# Confidence threshold for license detection (0.0–1.0).
confidence-threshold = 0.8

[bans]
# Duplicate versions are reported but NOT denied. This is a deliberate,
# time-boxed exception, not an oversight: measured with
# `cargo tree --duplicates --workspace --target all` against the committed
# Cargo.lock on 2026-08-02, the graph carries 14 crate names at 30 versions --
# cpufeatures, getrandom (0.2/0.3/0.4), linux-raw-sys, r-efi, rand (0.8/0.9),
# rand_chacha, rand_core, rustix (0.38/1.1), serde_spanned, syn (2/3),
# toml (0.8/1.1), toml_datetime, windows-sys (0.52/0.59/0.61) and winnow.
# All of them are transitive and most are inherited from a single laggard
# (proptest pulls rand 0.9 against the workspace's rand 0.8; ring pins
# windows-sys 0.52; ssk-ipc pins rustix 0.38 against tempfile's 1.1).
# Flipping this to "deny" today turns CI red without fixing anything, so the
# collapse is scheduled as P6 repo hygiene in docs/WINDOWS_PRODUCT_ROADMAP.md.
# Do not set this to "deny" before those upgrades land.
multiple-versions = "warn"
# Deny wildcard dependencies.
wildcards = "deny"
# Deny crates known to introduce risk.
deny = []

[sources]
# Only allow dependencies sourced from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
