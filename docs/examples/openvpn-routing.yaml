routing:
  default_profile: corporate
  profiles:
  - id: corporate
    name: Corporate OpenVPN (not yet available)
    rules:
    - id: require-vpn
      priority: 10
      destination: null
      domain_suffix: null
      port: null
      action:
        kind: adapter
        adapter_id: corporate-vpn
      require_attestation: false
  adapters:
  - id: corporate-vpn
    transport:
      kind: open_vpn
      profile_id: company-managed
ingress:
  enabled: false
  listen:
    address: 127.0.0.1
    port: 10800
  protocols:
  - socks5
  hardening: required
  arm_on_start: false
  direct_address_families: ipv4_only
  limits:
    max_connections: 256
    accept_rate_per_s: 50
    handshake_timeout_ms: 10000
    connect_timeout_ms: 20000
    idle_timeout_ms: 3600000
  audit:
    segment_mib: 32
    retain_segments: 8
    destination_logging: plain
version: 5
policy:
  name: default-fail-closed
  fail_closed: true
  gate_profile:
    order:
    - Core
    - Mirror
    - Locator
    - Bcik
    - Hypercube
    - Capability
    - Fiber
    - Privacy
    - Boundary
    - Focus
    - Replay
    - Dissolution
    fail_closed: true
    thresholds: {}
    required_evidence: []
    failure_policy: no_materialization
    hold_policy: diagnosable_non_persistent
    pass_policy: materialize_only
runtime:
  strict_mode: true
  metrics_path: .ssk/metrics.json
interop:
  min_protocol: 1.0.0
  capabilities:
  - gate-vector-12
  - replay-v1
  max_clock_skew_secs: 300
system:
  name: ScorpioSync-Kaleidoscorp-Omega
  fail_closed: true
  mode: research_testbed
core:
  canonicalization: deterministic
  signature_policy: core_boundary_residue
  expose_core_address: false
locator_plane:
  allowed_types:
  - DirectIp
  - VpnExit
  - ProxyExit
  - Relay
  - Gateway
  - MultiHopPath
  - LocalOverlay
  require_locator_reality_check: true
  single_ip_external_privacy_claim: forbidden
projective_connection_hypercube:
  axes:
  - identity
  - locator
  - protocol
  - timing
  - trust
  - risk
  - capability
  - replay
  - boundary
  require_all_axis_projection: true
hypertorus:
  dimension: 7
  phase_axes:
  - identity
  - locator
  - protocol
  - timing
  - risk
  - replay
  - focus
  mode: deterministic
  deterministic_replay: true
bcik:
  require_seam: true
  require_boundary_operator: true
  closure_threshold: 0.0
  tolerated_residue_threshold: policy_defined
capabilities:
  witness_required: true
  allowed_witnesses:
  - signature
  - token
  - zk_style
  - policy_cert
  require_scope_and_expiry: true
privacy:
  adversary_model: PartialNetworkObserver
  linkability_threshold: policy_defined
  require_residue_report: true
replay:
  run_descriptor_required: true
  deterministic_materialization_required: true
ledger:
  append_only_audit: true
  store_payload: false
  store_trace_hash: true
dissolution:
  ttl_required: true
  finalize_residues_on_expiry: true
