# Kaleidoscorp configuration, version 5, with the local proxy section enabled.
# Generated by `cargo run -p ssk-config --example ingress_config`; a test fails when
# this file differs from that output, so regenerate it instead of editing it.
#
# `routing` is the default: no rule, so every connection is denied. See
# ingress-coexistence.yaml for a complete scenario with rules.
# `ingress` shows every key at its default except `enabled`. `ingress: {}` is a valid,
# disabled section; a misspelled key anywhere in it is refused, not ignored.
# This build validates the section and does not open a listener yet.
#
# Numbers below `ingress`: key, default, accepted range.
#   limits.max_connections            256  1..=4096
#   limits.accept_rate_per_s           50  1..=10000
#   limits.handshake_timeout_ms     10000  100..=60000
#   limits.connect_timeout_ms       20000  100..=120000
#   limits.idle_timeout_ms        3600000  100..=86400000
#   audit.segment_mib                  32  1..=256
#   audit.retain_segments               8  2..=64
# audit.segment_mib x audit.retain_segments may not exceed 1024 MiB. The ledger is
# kept by size only: there is no age limit and no key for one.
#
routing:
  default_profile: default
  profiles:
  - id: default
    name: Default (deny until configured)
    rules: []
  adapters: []
ingress:
  enabled: true
  listen:
    address: 127.0.0.1
    port: 10800
  protocols:
  - socks5
  hardening: required
  arm_on_start: false
  direct_address_families: ipv4_only
  limits:
    max_connections: 256
    accept_rate_per_s: 50
    handshake_timeout_ms: 10000
    connect_timeout_ms: 20000
    idle_timeout_ms: 3600000
  audit:
    segment_mib: 32
    retain_segments: 8
    destination_logging: plain
version: 5
policy:
  name: default-fail-closed
  fail_closed: true
  gate_profile:
    order:
    - Core
    - Mirror
    - Locator
    - Bcik
    - Hypercube
    - Capability
    - Fiber
    - Privacy
    - Boundary
    - Focus
    - Replay
    - Dissolution
    fail_closed: true
    thresholds: {}
    required_evidence: []
    failure_policy: no_materialization
    hold_policy: diagnosable_non_persistent
    pass_policy: materialize_only
runtime:
  strict_mode: true
  metrics_path: .ssk/metrics.json
interop:
  min_protocol: 1.0.0
  capabilities:
  - gate-vector-12
  - replay-v1
  max_clock_skew_secs: 300
system:
  name: ScorpioSync-Kaleidoscorp-Omega
  fail_closed: true
  mode: research_testbed
core:
  canonicalization: deterministic
  signature_policy: core_boundary_residue
  expose_core_address: false
locator_plane:
  allowed_types:
  - DirectIp
  - VpnExit
  - ProxyExit
  - Relay
  - Gateway
  - MultiHopPath
  - LocalOverlay
  require_locator_reality_check: true
  single_ip_external_privacy_claim: forbidden
projective_connection_hypercube:
  axes:
  - identity
  - locator
  - protocol
  - timing
  - trust
  - risk
  - capability
  - replay
  - boundary
  require_all_axis_projection: true
hypertorus:
  dimension: 7
  phase_axes:
  - identity
  - locator
  - protocol
  - timing
  - risk
  - replay
  - focus
  mode: deterministic
  deterministic_replay: true
bcik:
  require_seam: true
  require_boundary_operator: true
  closure_threshold: 0.0
  tolerated_residue_threshold: policy_defined
capabilities:
  witness_required: true
  allowed_witnesses:
  - signature
  - token
  - zk_style
  - policy_cert
  require_scope_and_expiry: true
privacy:
  adversary_model: PartialNetworkObserver
  linkability_threshold: policy_defined
  require_residue_report: true
replay:
  run_descriptor_required: true
  deterministic_materialization_required: true
ledger:
  append_only_audit: true
  store_payload: false
  store_trace_hash: true
dissolution:
  ttl_required: true
  finalize_residues_on_expiry: true
