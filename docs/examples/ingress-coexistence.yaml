# Kaleidoscorp configuration, version 5: Direct through the operating system's route
# for proxy clients, beside a third-party tunnel application (design 2.4).
# Generated by `cargo run -p ssk-config --example coexistence_config`; a test fails
# when this file differs from that output, so regenerate it instead of editing it.
#
# Rules are matched by ascending priority and the first match wins; a flow that
# matches no rule is denied. The three `echo-ipify*` rules match by NAME: a client
# that resolves the name itself and sends an address does not match them and falls
# to `allow-rest-443`. The two `allow-rest-*` rules open every name on those ports
# for Direct; write narrower rules for less. An exact-IP `deny` rule would be added
# above them.
#
# `arm_on_start: false` keeps the proxy disarmed after a restart: arm it by hand once
# the tunnel application shows connected. `hardening: best_effort` is a visible
# operator choice; the default is `required`. `direct_address_families: ipv4_only`
# keeps Direct off IPv6, which a tunnel may not cover.
# This build validates the section and does not open a listener yet.
#
routing:
  default_profile: coexist
  profiles:
  - id: coexist
    name: Direct through the operating system route, proxy clients only
    rules:
    - id: deny-blocked-example
      priority: 5
      destination: null
      domain_suffix: blocked.example
      port: null
      action:
        kind: deny
      require_attestation: false
    - id: echo-ipify
      priority: 10
      destination: api.ipify.org
      domain_suffix: null
      port: 443
      action:
        kind: direct
      require_attestation: false
    - id: echo-ipify-dual
      priority: 11
      destination: api64.ipify.org
      domain_suffix: null
      port: 443
      action:
        kind: direct
      require_attestation: false
    - id: echo-ipify-v6
      priority: 12
      destination: api6.ipify.org
      domain_suffix: null
      port: 443
      action:
        kind: direct
      require_attestation: false
    - id: allow-rest-443
      priority: 900
      destination: null
      domain_suffix: null
      port: 443
      action:
        kind: direct
      require_attestation: false
    - id: allow-rest-80
      priority: 901
      destination: null
      domain_suffix: null
      port: 80
      action:
        kind: direct
      require_attestation: false
  adapters: []
ingress:
  enabled: true
  listen:
    address: 127.0.0.1
    port: 10800
  protocols:
  - socks5
  hardening: best_effort
  arm_on_start: false
  direct_address_families: ipv4_only
  limits:
    max_connections: 256
    accept_rate_per_s: 50
    handshake_timeout_ms: 10000
    connect_timeout_ms: 20000
    idle_timeout_ms: 3600000
  audit:
    segment_mib: 32
    retain_segments: 8
    destination_logging: plain
version: 5
policy:
  name: default-fail-closed
  fail_closed: true
  gate_profile:
    order:
    - Core
    - Mirror
    - Locator
    - Bcik
    - Hypercube
    - Capability
    - Fiber
    - Privacy
    - Boundary
    - Focus
    - Replay
    - Dissolution
    fail_closed: true
    thresholds: {}
    required_evidence: []
    failure_policy: no_materialization
    hold_policy: diagnosable_non_persistent
    pass_policy: materialize_only
runtime:
  strict_mode: true
  metrics_path: .ssk/metrics.json
interop:
  min_protocol: 1.0.0
  capabilities:
  - gate-vector-12
  - replay-v1
  max_clock_skew_secs: 300
system:
  name: ScorpioSync-Kaleidoscorp-Omega
  fail_closed: true
  mode: research_testbed
core:
  canonicalization: deterministic
  signature_policy: core_boundary_residue
  expose_core_address: false
locator_plane:
  allowed_types:
  - DirectIp
  - VpnExit
  - ProxyExit
  - Relay
  - Gateway
  - MultiHopPath
  - LocalOverlay
  require_locator_reality_check: true
  single_ip_external_privacy_claim: forbidden
projective_connection_hypercube:
  axes:
  - identity
  - locator
  - protocol
  - timing
  - trust
  - risk
  - capability
  - replay
  - boundary
  require_all_axis_projection: true
hypertorus:
  dimension: 7
  phase_axes:
  - identity
  - locator
  - protocol
  - timing
  - risk
  - replay
  - focus
  mode: deterministic
  deterministic_replay: true
bcik:
  require_seam: true
  require_boundary_operator: true
  closure_threshold: 0.0
  tolerated_residue_threshold: policy_defined
capabilities:
  witness_required: true
  allowed_witnesses:
  - signature
  - token
  - zk_style
  - policy_cert
  require_scope_and_expiry: true
privacy:
  adversary_model: PartialNetworkObserver
  linkability_threshold: policy_defined
  require_residue_report: true
replay:
  run_descriptor_required: true
  deterministic_materialization_required: true
ledger:
  append_only_audit: true
  store_payload: false
  store_trace_hash: true
dissolution:
  ttl_required: true
  finalize_residues_on_expiry: true
