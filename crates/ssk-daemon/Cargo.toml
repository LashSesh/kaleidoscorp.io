[package]
name = "ssk-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sskd"
path = "src/main.rs"

[dependencies]
ssk-types = { path = "../ssk-types", version = "0.1.0" }
ssk-config = { path = "../ssk-config", version = "0.1.0" }
ssk-netadmin = { path = "../ssk-netadmin", version = "0.1.0" }
ssk-netcore = { path = "../ssk-netcore", version = "0.1.0" }
ssk-tensor = { path = "../ssk-tensor", version = "0.1.0" }
ssk-ipc = { path = "../ssk-ipc", version = "0.1.0" }
# The kill-switch seam (`src/killswitch.rs`), CLIENT SIDE ONLY.
#
# `ssk-boundary` is needed for `KillSwitchState`, so `view_of` can match the
# broker's journal state EXHAUSTIVELY. The alternative — comparing
# `logical_state.as_str()` against `"engaged"` — would let a rename in
# `ssk-boundary` silently flip this daemon to reporting "not engaged", which is
# the exact fail-open this seam exists to remove.
#
# `ssk-netd-helper` is needed for `KillSwitchStatus`/`Recovery` and for
# `PrivilegedClient`, which is how the daemon ASKS the privileged broker instead
# of observing the OS itself. The enforcement design preferred that this edge not
# exist at all (the production provider was to live in `ssk-winhost`, which
# already has it), and that remains the better shape; it was not reachable from
# this change's file scope because `ssk-winhost` re-exports the pipe transport
# but not `PrivilegedClient`. Constraints that hold regardless, and that
# `src/killswitch.rs` documents:
#   * nothing here constructs a `Broker`, a `ReceiptStore`, a `BoundaryEnforcer`
#     or an `EgressObserver` — the privileged core stays out of the unprivileged
#     daemon;
#   * both crates are pure and `#![forbid(unsafe_code)]`;
#   * acyclic — neither reaches back to `ssk-daemon` (verified with `cargo tree`).
ssk-boundary = { path = "../ssk-boundary", version = "0.1.0" }
ssk-netd-helper = { path = "../ssk-netd-helper", version = "0.1.0" }
# Process diagnostics: the subscriber, the durable rotated sink, the panic hook
# and the OS-CSPRNG probe. This crate used to carry `src/diag.rs` and
# `src/entropy.rs`, with `ssk-cli` carrying an inline copy of both; that
# duplication is what produced the `/dev/urandom` defect twice, and `ssk-svc`
# would have been the third copy. `tracing-subscriber`, `tracing-appender` and
# `getrandom` moved with them and are no longer direct dependencies here.
ssk-diag = { path = "../ssk-diag", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
# The hash chain of the ingress flow ledger (`ingress/audit/record.rs`): the same
# crate and major `ssk-types` and `ssk-netadmin` already use for the activation
# ledger, so the workspace gains no hashing dependency.
blake3.workspace = true
# The operating system's random source: the per-command anti-replay nonces of the
# privileged broker's protocol (a predictable nonce is one an attacker can burn
# ahead of a legitimate client, `killswitch.rs`) and the key of the ingress ledger's
# `hashed` destinations (`ingress/audit/dest.rs`). Same crate and major as
# `ssk-diag`, `ssk-cli` and `ssk-winhost` -- no fourth `getrandom` major, no new
# FFI here (this crate stays `forbid(unsafe_code)`). It was a Windows-only
# dependency until the destination key needed it on every platform.
getrandom = "0.3"
thiserror.workspace = true
tracing.workspace = true
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "net",
    "signal",
    "time",
    "macros",
    "io-util",
] }

[target.'cfg(unix)'.dependencies]
# `flock` for the daemon lock. Same crate and version `ssk-ipc` already carries
# for its peer-credential check; only the `fs` feature is new. A kernel-held
# lock is released on `SIGKILL`, which a `create_new` lock file is not.
# `std` is required: without it rustix uses its own no_std `AsFd` polyfill and
# `std::fs::File` does not implement it, so `flock(&file, ..)` in `lock.rs`
# fails to compile (E0277) on Linux.
#
# `process` is `getrlimit` for the ingress descriptor budget (`ingress/budget.rs`):
# the safe API, so `unsafe_code = "forbid"` holds. The limit is read, never raised.
rustix = { version = "0.38", default-features = false, features = ["fs", "std", "process"] }

[target.'cfg(windows)'.dependencies]
# The composition root's Windows half. `ssk_ipc::server::serve_named_pipe`
# *requires* a `PipeFactory` (which must call
# `create_with_security_attributes_raw` with a real DACL) and a
# `PeerAuthenticator` (which must impersonate the pipe client and read
# `TokenUser`); `ssk_ipc::paths::named_pipe_name` requires this process's SID.
# All three are Win32 FFI and live in `ssk-winhost`, the one crate exempt from
# `unsafe_code = "forbid"`. This crate stays `#![forbid(unsafe_code)]` and only
# *injects* them — which is the point of the seam: a security control with no
# production caller is the defect this edge exists to close.
#
# Acyclic: `ssk-winhost` depends on ssk-ipc/ssk-types/ssk-boundary/ssk-capture/
# ssk-service-host/ssk-netd-helper, none of which reach back to `ssk-daemon`.
ssk-winhost = { path = "../ssk-winhost", version = "0.1.0" }
# The privileged pipe's CLIENT transport (`NamedPipeClientTransport`), which is
# what `killswitch::PrivilegedPipeStatus` dials — and, critically, the thing that
# verifies the endpoint is owned by `S-1-5-18` before the first frame. Without
# that check a squatter on the fixed pipe name could answer a forged "engaged".

[dev-dependencies]
ssk-desktop-client = { path = "../ssk-desktop-client", version = "0.1.0" }
tempfile.workspace = true
serde_yaml.workspace = true
proptest.workspace = true
# Paused time for the pump and limiter tests: an idle timeout of 30 s is
# asserted to the millisecond without waiting 30 s.
tokio = { version = "1", features = ["test-util"] }
# `tests/kill_switch_status.rs` drives a REAL `ssk_netd_helper::Broker` behind a
# real `PrivilegedServer` over an in-memory `FrameTransport` pair. Building that
# broker needs its actuation manifest and its `(principal, verb)` table.
ssk-signature = { path = "../ssk-signature", version = "0.1.0" }

[lints]
workspace = true
