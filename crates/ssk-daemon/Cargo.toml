[package]
name = "ssk-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sskd"
path = "src/main.rs"

[dependencies]
ssk-types = { path = "../ssk-types", version = "0.1.0" }
ssk-config = { path = "../ssk-config", version = "0.1.0" }
ssk-netadmin = { path = "../ssk-netadmin", version = "0.1.0" }
ssk-netcore = { path = "../ssk-netcore", version = "0.1.0" }
ssk-tensor = { path = "../ssk-tensor", version = "0.1.0" }
ssk-ipc = { path = "../ssk-ipc", version = "0.1.0" }
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "net",
    "signal",
    "time",
    "macros",
    "io-util",
] }

[dev-dependencies]
tempfile.workspace = true
serde_yaml.workspace = true

[lints]
workspace = true
