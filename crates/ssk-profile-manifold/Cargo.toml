# The SSCL ProfileManifold (SSCL-3): versioned privacy/routing posture profiles
# with gated, audited transitions. A transition is content-addressed, gated on an
# authorization (a privacy downgrade requires an elevated authorization), and
# appended to a hash-chained audit ledger. See SYSTEM_ARCHITECTURE_CORRESPONDENCE.md.

