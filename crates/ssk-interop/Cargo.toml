[package]
name = "ssk-interop"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Enables `Blake3KeyedVerifier::new_test_key()`, which supplies the fixed
# all-zero reference key used by protocol conformance self-tests. Never
# enable this for peer-trust verification in a shipped binary.
insecure-test-keys = []

[dependencies]
serde.workspace = true
thiserror.workspace = true
ciborium.workspace = true
blake3.workspace = true
hex.workspace = true
ssk-types = { path = "../ssk-types", version = "0.1.0" }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
# Self-dependency: unifies `insecure-test-keys` on for `cargo test -p ssk-interop`
# without enabling it by default for real consumers.
ssk-interop = { path = ".", features = ["insecure-test-keys"] }

[lints]
workspace = true
