<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Strict CSP (SPEC_TAURI_GUI.md §9): everything bundled, no remote origins,
         no inline script. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ScorpioSync — Control Panel</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header>
      <h1>ScorpioSync Control Panel</h1>
      <span id="panel-state" class="badge">disconnected</span>
    </header>

    <main>
      <!-- Kill-switch security panel -->
      <section id="killswitch" aria-labelledby="ks-h">
        <h2 id="ks-h">Kill switch</h2>
        <div id="ks-light" class="light neutral" role="status" aria-live="polite">
          <span id="ks-headline">unknown</span>
        </div>
        <dl id="ks-fields"></dl>
      </section>

      <!-- Boundary audit ledger -->
      <section id="audit" aria-labelledby="au-h">
        <h2 id="au-h">Audit ledger <span id="au-integrity" class="badge"></span></h2>
        <table id="au-table">
          <thead>
            <tr><th>seq</th><th>event</th><th>from→to</th><th>actor</th><th>hash</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <!-- Connections -->
      <section id="connections" aria-labelledby="co-h">
        <h2 id="co-h">Connections <span id="co-note" class="badge"></span></h2>
        <table id="co-table">
          <thead>
            <tr><th>proto</th><th>local</th><th>remote</th><th>pid</th><th>status</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>

    <script src="panel.js"></script>
  </body>
</html>
