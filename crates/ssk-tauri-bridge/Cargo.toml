[package]
name = "ssk-tauri-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

# P1 read-only GUI backend (SPEC_TAURI_GUI.md §9, §10). This crate is the
# portable "view core": pure, synchronous projection functions that turn the
# read-only SSK security surfaces into presentation DTOs, plus the UI state
# machine and the fail-closed error type. Default `cargo build/test` on Linux
# compiles ONLY this portable core — no webview, no Windows.
#
# The #[tauri::command] glue + WebView2 window and the ts-rs TypeScript export
# are not implemented here. The standalone frontend at ui/desktop has its own
# Node-only test job; wire types live in ssk-ui-contract. See ui/INTEGRATION.md
# for the remaining desktop host work. The default Rust build needs no webview.

[dependencies]
ssk-ui-contract = { path = "../ssk-ui-contract", version = "0.1.0" }
ssk-netd-helper = { path = "../ssk-netd-helper", version = "0.1.0" }
ssk-boundary = { path = "../ssk-boundary", version = "0.1.0" }
ssk-winhost = { path = "../ssk-winhost", version = "0.1.0" }
ssk-system = { path = "../ssk-system", version = "0.1.0" }
ssk-crown = { path = "../ssk-crown", version = "0.1.0" }
ssk-meta-resonance = { path = "../ssk-meta-resonance", version = "0.1.0" }
ssk-types = { path = "../ssk-types", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
ssk-signature = { path = "../ssk-signature", version = "0.1.0" }
ssk-capture = { path = "../ssk-capture", version = "0.1.0" }
ssk-field-tensor = { path = "../ssk-field-tensor", version = "0.1.0" }
ssk-mpk = { path = "../ssk-mpk", version = "0.1.0" }
ssk-service-host = { path = "../ssk-service-host", version = "0.1.0" }

[lints]
workspace = true
