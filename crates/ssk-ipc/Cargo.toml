[package]
name = "ssk-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ssk-types = { path = "../ssk-types", version = "0.1.0" }
ssk-netadmin = { path = "../ssk-netadmin", version = "0.1.0" }
ssk-config = { path = "../ssk-config", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
ciborium.workspace = true
thiserror.workspace = true
tracing.workspace = true
# `rand` used to be here for `auth::SessionToken::generate`. The token was
# minted per connection, never transmitted and never compared; it is gone (see
# `auth.rs`), and so is the dependency.
tokio = { version = "1", features = [
    "net",
    "rt-multi-thread",
    "sync",
    "io-util",
    "time",
    "macros",
] }

[target.'cfg(unix)'.dependencies]
# Only safe, minimal way to read our own uid (for the local peer-credential
# check in `auth.rs`) without adding `unsafe` or a raw libc dependency.
rustix = { version = "0.38", default-features = false, features = ["process"] }

[dev-dependencies]
tempfile.workspace = true
# `start_paused` for the accept-loop tests, so the 55 s of back-off is virtual
# time. Test-only, and the feature adds no crate (`ssk-desktop-client` already
# enables it the same way).
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
