[package]
name = "ssk-netcore"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Real, adapter-level egress executor (Direct/SOCKS5/HTTP-CONNECT/TLS/DNS-override) with health probing. Closes SSKΩ-7: the data plane ssk-netadmin plans routes for but does not execute."

[dependencies]
ssk-types = { path = "../ssk-types", version = "0.1.0" }
ssk-netadmin = { path = "../ssk-netadmin", version = "0.1.0" }
thiserror.workspace = true
tracing.workspace = true
tokio = { version = "1", features = ["net", "time", "io-util", "rt", "sync"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "test-util"] }
# Test only: reads `SO_BINDTODEVICE` back from a dialled socket (`direct.rs`
# tests, CO-1 of docs/M2_LOCAL_INGRESS_DESIGN.md 24.2.1). Already in the
# lockfile through tokio; a dev edge does not enter the allow-list of
# `dial_path_binds_nothing_static`, which lists what ships.
socket2 = { version = "0.6", features = ["all"] }

[lints]
workspace = true
