[package]
name = "ssk-netcore"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Real, adapter-level egress executor (Direct/SOCKS5/HTTP-CONNECT/TLS/DNS-override) with health probing. Closes SSKΩ-7: the data plane ssk-netadmin plans routes for but does not execute."

[dependencies]
ssk-types = { path = "../ssk-types", version = "0.1.0" }
ssk-netadmin = { path = "../ssk-netadmin", version = "0.1.0" }
thiserror.workspace = true
tracing.workspace = true
tokio = { version = "1", features = ["net", "time", "io-util", "rt", "sync"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }

[lints]
workspace = true
