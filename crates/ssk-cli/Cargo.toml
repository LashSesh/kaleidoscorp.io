[package]
name = "ssk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ssk"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
ssk-types = { path = "../ssk-types", version = "0.1.0" }
ssk-runtime = { path = "../ssk-runtime", version = "0.1.0" }
ssk-locator = { path = "../ssk-locator", version = "0.1.0" }
ssk-gates = { path = "../ssk-gates", version = "0.1.0" }
ssk-config = { path = "../ssk-config", version = "0.1.0" }
ssk-replay = { path = "../ssk-replay", version = "0.1.0" }
ssk-tensor = { path = "../ssk-tensor", version = "0.1.0", features = ["storage"] }
# `insecure-test-keys` is enabled here deliberately: `ssk interop conformance`
# runs a protocol self-test against golden vectors using the fixed reference
# key, not a peer-trust decision (see main.rs's `interop_command`). This is
# the one production exception; `ssk-netadmin`'s `AttestationBinder` (real
# flow attestation, below) has no such opt-in anywhere.
ssk-interop = { path = "../ssk-interop", version = "0.1.0", features = ["insecure-test-keys"] }
ssk-netadmin = { path = "../ssk-netadmin", version = "0.1.0" }
ssk-faultscan = { path = "../ssk-faultscan", version = "0.1.0" }
ssk-ipc = { path = "../ssk-ipc", version = "0.1.0" }
ssk-system = { path = "../ssk-system", version = "0.1.0" }
ssk-capture = { path = "../ssk-capture", version = "0.1.0" }
ssk-mpk = { path = "../ssk-mpk", version = "0.1.0" }
ssk-service-host = { path = "../ssk-service-host", version = "0.1.0" }
ssk-boundary = { path = "../ssk-boundary", version = "0.1.0" }
ssk-crown = { path = "../ssk-crown", version = "0.1.0" }
ssk-winhost = { path = "../ssk-winhost", version = "0.1.0" }
# Only "rt" + "net" + "macros": one-shot current-thread runtime for the new
# daemon-backed commands (status/activate/deactivate/list-profiles). `run` /
# `replay-verify` / `doctor` / etc. remain fully synchronous and local.
tokio = { version = "1", features = ["rt", "net", "macros"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
