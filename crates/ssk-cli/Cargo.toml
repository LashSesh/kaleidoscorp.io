[package]
name = "ssk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ssk"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
ssk-types = { path = "../ssk-types" }
ssk-runtime = { path = "../ssk-runtime" }
ssk-locator = { path = "../ssk-locator" }
ssk-gates = { path = "../ssk-gates" }
ssk-config = { path = "../ssk-config" }
ssk-replay = { path = "../ssk-replay" }
ssk-tensor = { path = "../ssk-tensor", features = ["storage"] }
# `insecure-test-keys` is enabled here deliberately: `ssk interop conformance`
# runs a protocol self-test against golden vectors using the fixed reference
# key, not a peer-trust decision (see main.rs's `interop_command`). This is
# the one production exception; `ssk-netadmin`'s `AttestationBinder` (real
# flow attestation, below) has no such opt-in anywhere.
ssk-interop = { path = "../ssk-interop", features = ["insecure-test-keys"] }
ssk-netadmin = { path = "../ssk-netadmin" }
ssk-faultscan = { path = "../ssk-faultscan" }
ssk-ipc = { path = "../ssk-ipc" }
# Only "rt" + "net" + "macros": one-shot current-thread runtime for the new
# daemon-backed commands (status/activate/deactivate/list-profiles). `run` /
# `replay-verify` / `doctor` / etc. remain fully synchronous and local.
tokio = { version = "1", features = ["rt", "net", "macros"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
