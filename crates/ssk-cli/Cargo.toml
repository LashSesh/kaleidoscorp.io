[package]
name = "ssk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ssk"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
ssk-types = { path = "../ssk-types", version = "0.1.0" }
ssk-runtime = { path = "../ssk-runtime", version = "0.1.0" }
ssk-locator = { path = "../ssk-locator", version = "0.1.0" }
ssk-gates = { path = "../ssk-gates", version = "0.1.0" }
ssk-config = { path = "../ssk-config", version = "0.1.0" }
ssk-replay = { path = "../ssk-replay", version = "0.1.0" }
ssk-tensor = { path = "../ssk-tensor", version = "0.1.0", features = ["storage"] }
# `insecure-test-keys` is enabled here deliberately: `ssk interop conformance`
# runs a protocol self-test against golden vectors using the fixed reference
# key, not a peer-trust decision (see main.rs's `interop_command`). This is
# the one production exception; `ssk-netadmin`'s `AttestationBinder` (real
# flow attestation, below) has no such opt-in anywhere.
ssk-interop = { path = "../ssk-interop", version = "0.1.0", features = ["insecure-test-keys"] }
ssk-netadmin = { path = "../ssk-netadmin", version = "0.1.0" }
ssk-faultscan = { path = "../ssk-faultscan", version = "0.1.0" }
ssk-ipc = { path = "../ssk-ipc", version = "0.1.0" }
ssk-system = { path = "../ssk-system", version = "0.1.0" }
ssk-capture = { path = "../ssk-capture", version = "0.1.0" }
ssk-mpk = { path = "../ssk-mpk", version = "0.1.0" }
ssk-service-host = { path = "../ssk-service-host", version = "0.1.0" }
ssk-boundary = { path = "../ssk-boundary", version = "0.1.0" }
ssk-crown = { path = "../ssk-crown", version = "0.1.0" }
ssk-winhost = { path = "../ssk-winhost", version = "0.1.0" }
# --- The privileged broker's protocol, CLIENT half only (roadmap P3) --------
# This edge did not exist before P3, and a comment in `main.rs` used to justify
# its absence: "the broker is the privileged layer P3 will host as SYSTEM, and
# the unprivileged CLI depending on it directly would invert that." That
# reasoning was about *hosting*. It does not survive P3's actual requirement,
# which is that `ssk winhost killswitch` stop actuating the firewall and start
# **speaking to** the broker — and a client must be able to name the protocol it
# speaks. What is used here is exactly the client surface: `PrivilegedClient`,
# `ClientHello`, `KillSwitchStatus`, `RejectReason`, `LeaseId`. `Broker` itself
# is never constructed in this crate, and a test asserts that (see
# `the_cli_never_constructs_a_broker`).
#
# The alternative — re-exporting a narrow facade from `ssk-winhost` — was
# rejected: it would put a portable protocol behind the one crate that is exempt
# from `forbid(unsafe_code)` and `#[cfg(windows)]`-only, so the rendering and
# error-mapping logic (all of which is pure) would become untestable off-Windows.
ssk-netd-helper = { path = "../ssk-netd-helper", version = "0.1.0" }
# Per-command anti-replay nonces and idempotency keys for the privileged
# transport. `ssk_netd_helper::NonceSource` is deliberately injected rather than
# generated inside that crate, and its doc says production must supply a CSPRNG:
# a predictable nonce is one an attacker can burn ahead of a legitimate client,
# turning anti-replay into denial-of-service. 0.3 is the major already in this
# graph via `ssk-diag` and `ssk-winhost`, so this adds no crate and no fourth
# `getrandom` major. On Windows it calls `ProcessPrng`; it never reads
# `/dev/urandom` on the platforms this binary ships to.
getrandom = "0.3"
# Only "rt" + "net" + "time" + "macros": one-shot current-thread runtime for the
# daemon-backed commands (status/activate/deactivate/list-profiles). `run` /
# `replay-verify` / `doctor` / etc. remain fully synchronous and local.
# "time" is not incidental: `DaemonClient::connect` sleeps between
# `ERROR_PIPE_BUSY` retries on Windows, so `enable_all` must start a time
# driver. `ssk-ipc` happens to enable it too, but a crate must declare the
# features its own call path requires rather than inherit them by unification.
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
# --- Process diagnostics (roadmap P2, task 5) -------------------------------
# `ssk` had NO tracing dependency at all, so the 14 emit sites in the libraries
# it links (ssk-winhost x11, ssk-boundary, ssk-crown, ssk-system,
# ssk-service-host, ssk-netcore) were unconditionally dropped and
# `docs/OBSERVABILITY.md`'s target catalog was unreachable from the shipped CLI.
tracing.workspace = true
# The subscriber, the durable rotated sink, the panic hook and `doctor`'s
# OS-CSPRNG probe. This file used to carry `tracing-subscriber`,
# `tracing-appender` and `getrandom` directly, for an inline `mod diag` and
# `mod entropy` that duplicated `ssk-daemon`'s — the duplication that produced
# the `/dev/urandom` defect in both crates at once. All three moved into
# `ssk-diag` with the code.
ssk-diag = { path = "../ssk-diag", version = "0.1.0" }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
