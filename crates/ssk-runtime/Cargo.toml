[package]
name = "ssk-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ssk-types = { path = "../ssk-types", version = "0.1.0" }
ssk-core = { path = "../ssk-core", version = "0.1.0" }
ssk-scheduler = { path = "../ssk-scheduler", version = "0.1.0" }
ssk-identity = { path = "../ssk-identity", version = "0.1.0" }
ssk-locator = { path = "../ssk-locator", version = "0.1.0" }
ssk-bcik = { path = "../ssk-bcik", version = "0.1.0" }
ssk-imdf = { path = "../ssk-imdf", version = "0.1.0" }
ssk-crypto = { path = "../ssk-crypto", version = "0.1.0" }
ssk-gates = { path = "../ssk-gates", version = "0.1.0" }
ssk-stitch = { path = "../ssk-stitch", version = "0.1.0" }
ssk-tensor = { path = "../ssk-tensor", version = "0.1.0" }
ssk-focus = { path = "../ssk-focus", version = "0.1.0" }
ssk-privacy = { path = "../ssk-privacy", version = "0.1.0" }
ssk-audit = { path = "../ssk-audit", version = "0.1.0" }
ssk-config = { path = "../ssk-config", version = "0.1.0" }
thiserror.workspace = true
serde.workspace = true

[dev-dependencies]
# Only used by tests/replay_vectors.rs — production code in src/ never
# depends on ssk-replay. Kept as a dev-dependency (not a regular one) so
# ssk-replay is free to depend on ssk-runtime itself (Section Q's shared
# `execute_pipeline` re-execution) without a dependency cycle.
ssk-replay = { path = "../ssk-replay", version = "0.1.0" }

[lints]
workspace = true
