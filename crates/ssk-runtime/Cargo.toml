[dependencies]
ssk-types = { path = "../ssk-types" }
ssk-core = { path = "../ssk-core" }
ssk-scheduler = { path = "../ssk-scheduler" }
ssk-identity = { path = "../ssk-identity" }
ssk-locator = { path = "../ssk-locator" }
ssk-bcik = { path = "../ssk-bcik" }
