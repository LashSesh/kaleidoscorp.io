[workspace]
resolver = "2"
members = [
  "crates/ssk-types",
  "crates/ssk-core",
  "crates/ssk-scheduler",
  "crates/ssk-identity",
  "crates/ssk-locator",
  "crates/ssk-bcik",
  "crates/ssk-gates",
  "crates/ssk-stitch",
  "crates/ssk-tensor",
  "crates/ssk-focus",
  "crates/ssk-audit",
  "crates/ssk-replay",
  "crates/ssk-faultscan",
  "crates/ssk-privacy",
  "crates/ssk-crypto",
  "crates/ssk-config",
  "crates/ssk-interop",
  "crates/ssk-runtime",
  "crates/ssk-sim",
  "crates/ssk-netadmin",
  "crates/ssk-netcore",
  "crates/ssk-signature",
  "crates/ssk-imdf",
  "crates/ssk-capture",
  "crates/ssk-boundary",
  "crates/ssk-mpk",
  "crates/ssk-field-tensor",
  "crates/ssk-meta-resonance",
  "crates/ssk-crown",
  "crates/ssk-host-cells",
  "crates/ssk-funnel-dag",
  "crates/ssk-profile-manifold",
  "crates/ssk-topology-scalpel",
  "crates/ssk-tfa",
  "crates/ssk-service-host",
  "crates/ssk-delivery",
  "crates/ssk-system",
  "crates/ssk-audit-store",
  "crates/ssk-winhost",
  "crates/ssk-cli",
  "crates/ssk-ipc",
  "crates/ssk-daemon",
  "crates/ssk-netd-helper",
  "crates/ssk-tauri-bridge",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"
authors = ["Kaleidoscorp Contributors"]
repository = "https://github.com/LashSesh/kaleidoscorp.io"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
ciborium = "0.2"
hex = "0.4"
sha2 = "0.10"
time = { version = "0.3", features = ["serde"] }
proptest = "1"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
serde_yaml = "0.9"
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
