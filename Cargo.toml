  "crates/ssk-gates",
  "crates/ssk-stitch",
  "crates/ssk-tensor",
  "crates/ssk-focus",
  "crates/ssk-audit",
  "crates/ssk-replay",
  "crates/ssk-faultscan",
  "crates/ssk-privacy",
  "crates/ssk-crypto",
  "crates/ssk-config",
  "crates/ssk-interop",
  "crates/ssk-runtime",
  "crates/ssk-netadmin",
  "crates/ssk-netanalysis",
  "crates/ssk-netcore",
  "crates/ssk-vpnctl",
  "crates/ssk-signature",
  "crates/ssk-imdf",
  "crates/ssk-capture",
  "crates/ssk-boundary",
  "crates/ssk-mpk",
  "crates/ssk-field-tensor",
  "crates/ssk-meta-resonance",
  "crates/ssk-crown",
  "crates/ssk-host-cells",
  "crates/ssk-funnel-dag",
  "crates/ssk-profile-manifold",
  "crates/ssk-topology-scalpel",
  "crates/ssk-tfa",
  "crates/ssk-service-host",
  "crates/ssk-delivery",
  "crates/ssk-system",
